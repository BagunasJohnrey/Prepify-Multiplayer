services:
  postgres:
    image: postgres:16-alpine
    container_name: prepify-postgres
    environment:
      POSTGRES_USER: prepify
      POSTGRES_PASSWORD: prepify
      POSTGRES_DB: prepify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/scripts/migrate.js:/docker-entrypoint-initdb.d/migrate.js:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepify -d prepify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prepify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: PgBouncer for connection pooling (production-like)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: prepify-pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_DBNAME: prepify
      DATABASES_USER: prepify
      DATABASES_PASSWORD: prepify
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "5"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: